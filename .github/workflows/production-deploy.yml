name: Deploy — Production (Native Build)

on:
  push:
    branches: [main]

jobs:
  eas-build-production:
    name: EAS Build → production
    runs-on: ubuntu-latest

    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build for production (iOS + Android)
        run: |
          eas build \
            --profile production \
            --platform all \
            --environment production \
            --non-interactive \
            --no-wait