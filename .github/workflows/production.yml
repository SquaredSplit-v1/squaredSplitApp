# Production Branch - Full Build & Store Submission
# Creates production builds and optionally submits to App Store / Google Play

name: "Production - Build & Deploy"

on:
  push:
    branches: [main]
    # Optionally trigger only on version tags:
    # tags:
    #   - 'v*'

jobs:
  update:
    name: EAS Update (Production)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Publish EAS Update to production channel
        run: eas update --branch production --message "${{ github.event.head_commit.message }}"

