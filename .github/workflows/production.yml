# Production Branch - Full Build & Store Submission
# Creates production builds and submits to App Store / Google Play

name: "Production - Build & Deploy"

on:
  push:
    branches: [main]
    tags:
      - "v*"

jobs:
  lint-and-typecheck:
    name: Lint & TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript type check
        run: npx tsc --noEmit

  update:
    name: EAS Update (Production)
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Publish EAS Update to production channel
        run: eas update --branch production --message "${{ github.event.head_commit.message }}"
        env:
          APP_ENV: production

  build-ios:
    name: Build iOS (Production)
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    # Only build on version tags or direct push to main
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build iOS (production profile)
        run: eas build --platform ios --profile production --non-interactive

  build-android:
    name: Build Android (Production)
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build Android (production profile)
        run: eas build --platform android --profile production --non-interactive

  submit:
    name: Submit to Stores
    runs-on: ubuntu-latest
    needs: [build-ios, build-android]
    # Only submit on version tags
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Submit iOS to App Store
        run: eas submit --platform ios --profile production --latest --non-interactive

      - name: Submit Android to Google Play
        run: eas submit --platform android --profile production --latest --non-interactive