# Dev Branch - EAS Update for Development
# Pushes OTA updates to the development channel for quick testing

name: "Dev - EAS Update"

on:
  push:
    branches: [dev]

jobs:
  eas-update:
    name: Push EAS Update to dev channel
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      
      - name: Install dependencies
        run: npm ci
      
      - name: Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish EAS Update
        run: |
          eas update --branch dev --message "dev: ${{ github.event.head_commit.message }}"
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          APP_ENV: ${{ vars.APP_ENV }}