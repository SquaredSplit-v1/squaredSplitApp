# Dev Branch - EAS Update for Development
# Pushes OTA updates to the development channel for quick testing

name: "Dev - EAS Update"

on:
  push:
    branches: [dev]

jobs:
  update:
    name: EAS Update (Development)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Publish EAS Update to development channel
        run: eas update --branch development --message "${{ github.event.head_commit.message }}"
