# Dev Branch - EAS Update for Development
# Pushes OTA updates to the development channel for quick testing

name: "Dev - CI & EAS Update"

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  lint-and-typecheck:
    name: Lint & TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript type check
        run: npx tsc --noEmit

  update:
    name: EAS Update (Development)
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    environment: development
    # Only run on push, not on PRs
    if: github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Publish EAS Update to development channel
        run: eas update --branch development --message "${{ github.event.head_commit.message }}"
        env:
          APP_ENV: development
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_KEY }}
          EXPO_PUBLIC_SUPABASE_PHONE_AUTH_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_PHONE_AUTH_URL }}
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}