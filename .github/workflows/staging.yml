# Staging Branch - Preview Build & EAS Update
# Creates internal builds for QA testing and pushes updates to staging channel

name: "Staging - Build & Update"

on:
  push:
    branches: [staging]

jobs:
  update:
    name: EAS Update (Staging)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Publish EAS Update to staging channel
        run: eas update --branch staging --message "${{ github.event.head_commit.message }}"

