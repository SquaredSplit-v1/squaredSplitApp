name: Deploy — Staging (OTA)

on:
  push:
    branches: [staging]

jobs:
  eas-update-staging:
    name: EAS Update → staging channel
    runs-on: ubuntu-latest

    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Publish OTA update → staging
        run: |
          eas update \
            --branch staging \
            --environment preview \
            --message "staging: ${{ github.sha }}" \
            --non-interactive