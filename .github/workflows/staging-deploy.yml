# Staging Branch - Preview Build & EAS Update
# Creates internal builds for QA testing and pushes updates to staging channel

name: "Staging - EAS Build"

on:
  push:
    branches: [staging]

jobs:
  eas-build-staging:
    name: Build APK + IPA for client and testers
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android APK (staging)
        run: |
          eas build \
            --platform android \
            --profile staging \
            --non-interactive \
            --no-wait
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          APP_ENV: ${{ vars.APP_ENV }}

      - name: Build iOS IPA (staging)
        run: |
          eas build \
            --platform ios \
            --profile staging \
            --non-interactive \
            --no-wait
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          APP_ENV: ${{ vars.APP_ENV }}
  